# Experiment: nq15m_three_pass_v1
# Pass 3/3: resume final checkpoint from pass 2.
# Controlled variable: cumulative full TRAIN pass number.
# Primary metric: validation balanced_score.
# Resume uses final checkpoints to preserve exactly three passes.

config_schema_version: 1
run:
  name: nq15m_three_pass_v1_pass03
  seed: 7
continuation:
  mode: resume
  source_run: nq15m_three_pass_v1_pass02
  checkpoint: final
data:
  path: data/NQ_CONTINUOUS_15m_WEEKDAYS_2010-06-07_00-00_2026-06-24_23-45_20260625_234319.parquet
  train_ratio: 0.9
training:
  duration_unit: data_epochs
  duration_amount: 1
environment:
  window: 40
  context: baseline_multiscale_v1
  position_side: long_only
  market_timezone: America/New_York
  rth_open: 09:30
  rth_close: '16:00'
  stake_pln: 1000.0
  fee_bps: 1.0
  swap_bps: 3.0
  swap_time: '17:00'
  swap_timezone: America/New_York
  force_close_on_done: true
  reward_scale: 1.0
  exposure_penalty: 0.0
  turnover_penalty: 0.0
  drawdown_penalty: 0.0
  profit_reward_mult: 1.0
  loss_reward_mult: 1.0
ppo:
  policy: mlp
  device: cuda
  hidden_sizes:
  - 64
  - 64
  activation: tanh
  n_steps: 2048
  batch_size: 1024
  n_epochs: 10
  learning_rate: 0.0003
  gamma: 0.9
  gae_lambda: 0.95
  clip_range: 0.2
  clip_range_vf: null
  normalize_advantage: true
  ent_coef: 0.0002
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: null
evaluation:
  eval_every_steps: 1000000000
  checkpoint_every_steps: 50000
  policy_mode: deterministic_argmax
  threshold_action: null
  probability_threshold: null
  best_metric: balanced_score
  early_stop_patience_evals: 5
