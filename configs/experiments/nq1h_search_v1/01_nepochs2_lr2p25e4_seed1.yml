  profit_reward_mult: 1.0
  loss_reward_mult: 1.0
ppo:
  policy: mlp
  device: cuda
  hidden_sizes:
  - 384
  - 384
  - 384
  activation: tanh
  value_head_init_scale: 0.003
  n_steps: 2048
  batch_size: 1024
  n_epochs: 2
  learning_rate: 0.000225
  gamma: 0.9
  gae_lambda: 0.95
