# Set source_checkpoint_id to a validated stage-one checkpoint before use.
# Architecture, environment, data path, device and reporting settings are inherited.
schema_version: 2
name: nq5m_stage_two_v1_seed2
seed: 2
validation_weeks: 4
test_weeks: 1
step_weeks: 1
update_epochs: 1
refit_epochs: 1
# Shared by base updates and trading-copy refit.
learning_rate: 0.000075
selection_rule: final_checkpoint
optimizer_policy: preserve_independent_copy
reject_updates: false
partial_test: skip
source_checkpoint_id: null
bootstrap_epochs: 1
