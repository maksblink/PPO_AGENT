[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ppo-agent"
version = "0.1.0"
description = "Configuration-driven PPO agent training and evaluation"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2,<3",
    "pandas>=2.2,<4",
    "pyarrow>=16,<25",
    "pydantic>=2.8,<3",
    "PyYAML>=6,<7",
    "gymnasium>=1.3,<2",
    "torch==2.12.1",
    "stable-baselines3==2.9.0",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "python-dotenv>=1.0,<2",
    "matplotlib>=3.9,<4",
    "streamlit>=1.49,<2",
    "plotly>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["train_and_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
