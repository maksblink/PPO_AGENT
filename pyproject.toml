[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ppo-agent"
version = "0.1.0"
description = "Configuration-driven PPO agent training and evaluation"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
packages = ["train_and_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
