# Proposal-only analysis. Bounds are editable starting values, not recommendations.
schema_version: 1
history:
  seed: 1
  mode: all                 # all | last | best
  best_by: return           # return | balanced_score (used by best mode)
  cohort: null             # If several cohorts exist, copy an ID from the report.
objective:
  name: return             # return | balanced_score | pareto
  scope: val
sampler:
  name: tpe
  seed: 42                 # Sampler RNG only; training history remains seed 1.
  multivariate: true
  group: true
  n_startup_trials: 10
  n_ei_candidates: 64
suggestions:
  count: 1
  exclude_evaluated: true
  max_sampling_attempts: 100
search_space:
  depth: {type: int, low: 1, high: 5, step: 1}
  width_1: {type: int, low: 1, high: 999999999, step: 1}
  width_2: {type: int, low: 1, high: 999999999, step: 1}
  width_3: {type: int, low: 1, high: 999999999, step: 1}
  width_4: {type: int, low: 1, high: 999999999, step: 1}
  width_5: {type: int, low: 1, high: 999999999, step: 1}
  learning_rate: {type: float, low: 0.0000000001, high: 0.1, log: true}
  ent_coef: {type: float, low: 0.0000000001, high: 0.1, log: true}
  gamma: {type: float, low: 0.00000001, high: 0.99999999, log: false}
  gae_lambda: {type: float, low: 0.00000001, high: 0.99999999, log: false}
  n_epochs: {type: int, low: 1, high: 999999999, step: 1}
  data_epochs: {type: int, low: 1, high: 999999999, step: 1}
report:
  output_dir: artifacts/optuna_propositions
  formats: [html, json]
  nearest_observations: 10
  include_full_paths: true
